# Reference nginx config for a self-hosted instance. Replace your.domain.example
# and the address in snippets-admin-only.conf, then let Certbot manage the TLS lines.

# Geo Insights — static SPA. Cert and renewal still managed by Certbot.
server {
    server_name your.domain.example;

    root /var/www/geo-insights;
    index index.html;

    client_max_body_size 200m;

    # GeoJSON compresses 5-10x, which is the single biggest win for shared links.
    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Hashed asset filenames are immutable; the entry document never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }



    # PocketBase admin UI — restricted by address.
    location ^~ /_/ {
        include snippets/admin-only.conf;
        include snippets/pocketbase-proxy.conf;
    }

    # Superuser login. Restricting the UI while leaving its credential endpoint
    # open would only move the front door, not lock it.
    location ^~ /api/collections/_superusers/ {
        include snippets/admin-only.conf;
        include snippets/pocketbase-proxy.conf;
    }

    # Application API — public: viewers and the app itself both need it.
    location ^~ /api/ {
        include snippets/pocketbase-proxy.conf;
    }

    # Published dashboards are data, not app routes: a missing one must 404 so
    # the viewer can say "this link no longer exists" instead of parsing HTML.
    location /shared/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Payloads are named by content hash, so they can never go stale.
    location /shared/data/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback, so future routes like /v/:shareId resolve to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/your.domain.example/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/your.domain.example/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = your.domain.example) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name your.domain.example;
    return 404; # managed by Certbot
}
